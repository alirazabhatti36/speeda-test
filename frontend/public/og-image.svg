<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1021"/>
    </linearGradient>
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#080c16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#080c16" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="80%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="meterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#cyanGlow)"/>
  <rect width="1200" height="630" fill="url(#purpleGlow)"/>

  <!-- Border Card -->
  <rect x="30" y="30" width="1140" height="570" rx="24" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2"/>

  <!-- Brand Logo & Badge -->
  <g transform="translate(80, 110)">
    <text font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#ffffff">
      ⚡ Speeda Test <tspan fill="url(#textGrad)">360</tspan>
    </text>
    <text y="50" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" fill="#38bdf8">
      Real-Time Internet Speed Test &amp; Global Broadband Diagnostics
    </text>
  </g>

  <!-- Central Speed Display Dial -->
  <g transform="translate(600, 360)">
    <!-- Outer Arc Track -->
    <path d="M -220 0 A 220 220 0 1 1 220 0" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="24" stroke-linecap="round"/>
    <!-- Active Arc with Glow -->
    <path d="M -220 0 A 220 220 0 1 1 140 -170" fill="none" stroke="url(#meterGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glowFilter)"/>
    <!-- Value -->
    <text text-anchor="middle" y="20" font-family="ui-monospace, monospace" font-size="96" font-weight="900" fill="#ffffff">
      360.5
    </text>
    <text text-anchor="middle" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#00f2fe">
      Mbps Download Throughput
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(80, 520)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="230" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(0, 242, 254, 0.3)" stroke-width="1.5"/>
    <text x="115" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      🎮 Esports Ping Test
    </text>

    <!-- Pill 2 -->
    <rect x="250" y="0" width="230" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(99, 102, 241, 0.3)" stroke-width="1.5"/>
    <text x="365" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      📺 4K Video Streaming
    </text>

    <!-- Pill 3 -->
    <rect x="500" y="0" width="240" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.5"/>
    <text x="620" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      🏆 Global ISP Rankings
    </text>

    <!-- Pill 4 -->
    <rect x="760" y="0" width="280" height="46" rx="23" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(251, 146, 60, 0.3)" stroke-width="1.5"/>
    <text x="900" y="29" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="700" fill="#f8fafc">
      🌐 100% Free &amp; Unthrottled
    </text>
  </g>
</svg>
